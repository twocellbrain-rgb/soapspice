openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: SoapSpice public ingredient catalog API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: ingredients
    description: Public ingredient reference data
  - name: ingredient administration
    description: Authenticated staff-only editing and review
  - name: recipes
    description: Private maker formulas
  - name: starter guide
    description: Public soapmaking setup guidance and staff-managed product recommendations
  - name: calculator products
    description: Public ingredient-matched product recommendations managed by staff
paths:
  /starter-guide-products:
    get:
      operationId: listStarterGuideProducts
      tags: [starter guide]
      summary: List manually curated starter-guide product links
      responses:
        "200":
          description: Product links grouped by tool
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StarterGuideProductGroup" }
  /calculator-ingredient-products:
    get:
      operationId: listCalculatorIngredientProducts
      tags: [calculator products]
      summary: List manually curated product cards grouped by catalog ingredient
      responses:
        "200":
          description: Product cards grouped by eligible ingredient
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CalculatorIngredientProductGroup" }
  /starter-guide-admin/amazon/status:
    get:
      operationId: getStarterGuideAmazonApiStatus
      tags: [starter guide]
      summary: Check whether Amazon Creators API search is configured
      responses:
        "200":
          description: API configuration status without exposing credentials
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StarterGuideAmazonApiStatus" }
        "401": { description: Sign in required }
        "403": { description: Ingredient staff access required }
  /starter-guide-admin/amazon/search:
    get:
      operationId: searchStarterGuideAmazonProducts
      tags: [starter guide]
      summary: Search Amazon Creators API for products
      parameters:
        - in: query
          name: keywords
          required: true
          schema: { type: string, minLength: 2, maxLength: 120 }
      responses:
        "200":
          description: Up to ten matching Amazon products
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StarterGuideAmazonProduct" }
        "400": { description: Invalid search phrase }
        "401": { description: Sign in required }
        "403": { description: Ingredient staff access required }
        "502": { description: Amazon Creators API request failed }
        "503": { description: Amazon Creators API is not configured }
  /starter-guide-admin/{toolSlug}:
    parameters:
      - in: path
        name: toolSlug
        required: true
        schema: { $ref: "#/components/schemas/StarterGuideToolSlug" }
    put:
      operationId: replaceStarterGuideProducts
      tags: [starter guide]
      summary: Replace two or three product recommendations for a tool
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StarterGuideProductsInput" }
      responses:
        "200":
          description: Saved product recommendations
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StarterGuideProductGroup" }
        "400": { description: Invalid product list or non-Amazon URL }
        "401": { description: Sign in required }
        "403": { description: Ingredient staff access required }
    delete:
      operationId: deleteStarterGuideProducts
      tags: [starter guide]
      summary: Remove all product links for a tool
      responses:
        "204": { description: Product links removed }
        "401": { description: Sign in required }
        "403": { description: Ingredient staff access required }
  /calculator-ingredient-products-admin/{ingredientId}:
    parameters:
      - in: path
        name: ingredientId
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 100
    put:
      operationId: replaceCalculatorIngredientProducts
      tags: [calculator products]
      summary: Replace manually curated product cards for one ingredient
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CalculatorIngredientProductsInput" }
      responses:
        "200":
          description: Saved product cards
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CalculatorIngredientProductGroup" }
        "400": { description: Invalid product list or non-Amazon URL }
        "401": { description: Sign in required }
        "403": { description: Ingredient staff access required }
        "404": { description: Ingredient not found or not publicly available }
    delete:
      operationId: deleteCalculatorIngredientProducts
      tags: [calculator products]
      summary: Remove all manually curated product cards for one ingredient
      responses:
        "204": { description: Product cards removed }
        "400": { description: Invalid ingredient ID }
        "401": { description: Sign in required }
        "403": { description: Ingredient staff access required }
  /recipes:
    get:
      operationId: listRecipes
      tags: [recipes]
      summary: List my saved formulas
      responses:
        "200":
          description: My formulas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Recipe"
        "401":
          description: Sign in required
    post:
      operationId: createRecipe
      tags: [recipes]
      summary: Save a validated formula
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecipeInput"
      responses:
        "201":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recipe"
        "400":
          description: Invalid formula
        "401":
          description: Sign in required
  /soapmaking-library:
    get:
      operationId: listSoapmakingLibrary
      tags: [soapmaking library]
      summary: List my saved soapmaking sources
      responses:
        "200":
          description: My saved sources
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SoapmakingLibraryItem" }
        "401": { description: Sign in required }
    post:
      operationId: saveSoapmakingLibraryItem
      tags: [soapmaking library]
      summary: Save a source citation and personal notes
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SoapmakingLibraryInput" }
      responses:
        "201":
          description: Saved source
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SoapmakingLibraryItem" }
        "400": { description: Invalid source details }
        "401": { description: Sign in required }
        "409": { description: This source is already saved }
  /soapmaking-library/{articleId}:
    parameters:
      - in: path
        name: articleId
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: deleteSoapmakingLibraryItem
      tags: [soapmaking library]
      summary: Remove a saved source
      responses:
        "204": { description: Removed }
        "401": { description: Sign in required }
        "404": { description: Source not found }
  /recipes/import:
    post:
      operationId: importRecipe
      tags: [recipes]
      summary: Preserve a legacy browser formula as an unvalidated draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LegacyRecipeInput"
      responses:
        "201":
          description: Imported draft (or previously imported copy)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recipe"
        "400":
          description: Invalid legacy record
        "401":
          description: Sign in required
  /recipes/{recipeId}:
    parameters:
      - in: path
        name: recipeId
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getRecipe
      tags: [recipes]
      summary: Open my formula
      responses:
        "200":
          description: Formula
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recipe"
        "404":
          description: Not found
    put:
      operationId: updateRecipe
      tags: [recipes]
      summary: Replace my formula after validation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecipeInput"
      responses:
        "200":
          description: Updated formula
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recipe"
        "400":
          description: Invalid formula
        "404":
          description: Not found
    delete:
      operationId: deleteRecipe
      tags: [recipes]
      summary: Delete my formula
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /ingredients:
    get:
      operationId: getIngredients
      tags: [ingredients]
      summary: List soapmaking ingredients
      parameters:
        - in: query
          name: search
          required: false
          schema:
            type: string
            maxLength: 100
        - in: query
          name: category
          required: false
          schema:
            type: string
            enum: [oil, butter]
      responses:
        "200":
          description: Source-linked ingredient reference data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Ingredient"
  /ingredients/{ingredientId}:
    get:
      operationId: getIngredient
      tags: [ingredients]
      summary: Get a soapmaking ingredient
      parameters:
        - in: path
          name: ingredientId
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 100
      responses:
        "200":
          description: Ingredient reference data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ingredient"
        "404":
          description: Ingredient not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /ingredient-admin/me:
    get:
      operationId: getIngredientStaff
      tags: [ingredient administration]
      summary: Check my ingredient staff access
      responses:
        "200":
          description: Staff role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngredientStaff"
        "401": { description: Sign in required }
        "403": { description: Staff access required }
  /ingredient-admin:
    get:
      operationId: listAdminIngredients
      tags: [ingredient administration]
      summary: List all ingredients including drafts and inactive records
      responses:
        "200":
          description: Staff catalog
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminIngredient" }
        "401": { description: Sign in required }
        "403": { description: Staff access required }
    post:
      operationId: createAdminIngredient
      tags: [ingredient administration]
      summary: Create a draft or source-linked ingredient
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IngredientEdit" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminIngredient" }
        "400": { description: Invalid input }
        "401": { description: Sign in required }
        "403": { description: Staff access required }
        "409": { description: Ingredient ID already exists }
  /ingredient-admin/{ingredientId}:
    put:
      operationId: editAdminIngredient
      tags: [ingredient administration]
      summary: Edit an ingredient and clear its prior approval
      parameters:
        - in: path
          name: ingredientId
          required: true
          schema: { type: string, minLength: 1, maxLength: 100 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IngredientEdit" }
      responses:
        "200":
          description: Edited
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminIngredient" }
        "400": { description: Invalid input }
        "401": { description: Sign in required }
        "403": { description: Staff access required }
        "404": { description: Ingredient not found }
  /ingredient-admin/{ingredientId}/approve:
    post:
      operationId: approveAdminIngredient
      tags: [ingredient administration]
      summary: Reviewer approves a cited SAP value
      parameters:
        - in: path
          name: ingredientId
          required: true
          schema: { type: string, minLength: 1, maxLength: 100 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IngredientApproval" }
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminIngredient" }
        "400": { description: Missing provenance or citation }
        "401": { description: Sign in required }
        "403": { description: Reviewer access required }
        "404": { description: Ingredient not found }
        "409": { description: Ingredient changed since reviewer loaded it }
components:
  schemas:
    StarterGuideAmazonApiStatus:
      type: object
      additionalProperties: false
      required: [configured, marketplace]
      properties:
        configured: { type: boolean }
        marketplace: { type: [string, "null"] }
    StarterGuideAmazonProduct:
      type: object
      additionalProperties: false
      required: [asin, title, url]
      properties:
        asin: { type: string, minLength: 1, maxLength: 32 }
        title: { type: string, minLength: 1, maxLength: 160 }
        url: { type: string, format: uri, minLength: 1, maxLength: 2000 }
    StarterGuideToolSlug:
      type: string
      enum: [safety-gear, digital-scale, lye-safe-containers, stick-blender, mold-and-cutter, finishing-tools]
    StarterGuideProduct:
      type: object
      additionalProperties: false
      required: [title, note, url]
      properties:
        title: { type: string, minLength: 1, maxLength: 160 }
        note: { type: string, minLength: 1, maxLength: 400 }
        url: { type: string, format: uri, minLength: 1, maxLength: 2000 }
    StarterGuideProductsInput:
      type: object
      additionalProperties: false
      required: [products]
      properties:
        products:
          type: array
          minItems: 2
          maxItems: 3
          items: { $ref: "#/components/schemas/StarterGuideProduct" }
    StarterGuideProductGroup:
      type: object
      additionalProperties: false
      required: [toolSlug, products, updatedAt]
      properties:
        toolSlug: { $ref: "#/components/schemas/StarterGuideToolSlug" }
        products:
          type: array
          minItems: 2
          maxItems: 3
          items: { $ref: "#/components/schemas/StarterGuideProduct" }
        updatedAt: { type: string, format: date-time }
    CalculatorIngredientProduct:
      type: object
      additionalProperties: false
      required: [title, note, url]
      properties:
        title: { type: string, minLength: 1, maxLength: 160 }
        note: { type: string, minLength: 1, maxLength: 400 }
        url: { type: string, format: uri, minLength: 1, maxLength: 2000 }
    CalculatorIngredientProductsInput:
      type: object
      additionalProperties: false
      required: [products]
      properties:
        products:
          type: array
          minItems: 1
          maxItems: 3
          items: { $ref: "#/components/schemas/CalculatorIngredientProduct" }
    CalculatorIngredientProductGroup:
      type: object
      additionalProperties: false
      required: [ingredientId, products, updatedAt]
      properties:
        ingredientId: { type: string, minLength: 1, maxLength: 100 }
        products:
          type: array
          minItems: 1
          maxItems: 3
          items: { $ref: "#/components/schemas/CalculatorIngredientProduct" }
        updatedAt: { type: string, format: date-time }
    SoapmakingLibraryKind:
      type: string
      enum: [article, recipe, tutorial, safety, other]
    SoapmakingLibraryInput:
      type: object
      additionalProperties: false
      required: [title, sourceUrl, sourceName, kind]
      properties:
        title: { type: string, minLength: 1, maxLength: 240 }
        sourceUrl: { type: string, format: uri, minLength: 1, maxLength: 2000 }
        sourceName: { type: string, minLength: 1, maxLength: 160 }
        kind: { $ref: "#/components/schemas/SoapmakingLibraryKind" }
        author: { type: string, maxLength: 160 }
        summary: { type: string, maxLength: 600 }
        notes: { type: string, maxLength: 1200 }
        tags:
          type: array
          maxItems: 12
          items: { type: string, minLength: 1, maxLength: 40 }
    SoapmakingLibraryItem:
      type: object
      additionalProperties: false
      required: [id, title, sourceUrl, sourceName, kind, tags, createdAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string, minLength: 1, maxLength: 240 }
        sourceUrl: { type: string, format: uri, minLength: 1, maxLength: 2000 }
        sourceName: { type: string, minLength: 1, maxLength: 160 }
        kind: { $ref: "#/components/schemas/SoapmakingLibraryKind" }
        author: { type: ["string", "null"], maxLength: 160 }
        summary: { type: ["string", "null"], maxLength: 600 }
        notes: { type: ["string", "null"], maxLength: 1200 }
        tags:
          type: array
          maxItems: 12
          items: { type: string, minLength: 1, maxLength: 40 }
        createdAt: { type: string, format: date-time }
    RecipeOilInput:
      type: object
      required: [id, percentage, weight]
      properties:
        id: { type: string, minLength: 1, maxLength: 100 }
        name: { type: string, maxLength: 120 }
        percentage: { type: number, minimum: 0, maximum: 100 }
        weight: { type: number, minimum: 0 }
    RecipeInput:
      type: object
      required: [name, batchSize, unit, superfat, oils]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        batchSize: { type: number, exclusiveMinimum: 0 }
        unit: { type: string, enum: [g, oz, lb] }
        superfat: { type: number, minimum: 0, maximum: 15 }
        concentration: { type: number, minimum: 25, maximum: 50 }
        fragrances:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/RecipeFragrance"
        liquidType: { type: string, enum: [distilled-water, goat-milk, cow-milk, other] }
        customLiquid: { type: string, maxLength: 120 }
        oilInputUnit: { type: string, enum: [percent, g, oz] }
        liquidMethod: { type: string, enum: [batch-22] }
        oils:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: "#/components/schemas/RecipeOilInput"
    LegacyRecipeInput:
      type: object
      required: [legacyId, name, batchSize, unit, superfat, oils]
      properties:
        legacyId: { type: string, minLength: 1, maxLength: 120 }
        name: { type: string, minLength: 1, maxLength: 120 }
        batchSize: { type: number, exclusiveMinimum: 0 }
        unit: { type: string, enum: [g, oz, lb] }
        superfat: { type: number, minimum: 0, maximum: 15 }
        concentration: { type: number, minimum: 25, maximum: 50 }
        fragrances:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/RecipeFragrance"
        liquidType: { type: string, enum: [distilled-water, goat-milk, cow-milk, other] }
        customLiquid: { type: string, maxLength: 120 }
        oilInputUnit: { type: string, enum: [percent, g, oz] }
        liquidMethod: { type: string, enum: [batch-22] }
        oils:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: "#/components/schemas/RecipeOilInput"
    RecipeOil:
      type: object
      required: [id, name, percentage, weight, savedSap]
      properties:
        id: { type: string }
        name: { type: string }
        percentage: { type: number }
        weight: { type: number }
        savedSap: { type: ["number", "null"] }
    Recipe:
      type: object
      required: [id, name, batchSize, unit, superfat, oils, imported, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        batchSize: { type: number }
        unit: { type: string, enum: [g, oz, lb] }
        superfat: { type: number }
        concentration: { type: number }
        fragrances:
          type: array
          items:
            $ref: "#/components/schemas/RecipeFragrance"
        liquidType: { type: string, enum: [distilled-water, goat-milk, cow-milk, other] }
        customLiquid: { type: string }
        oilInputUnit: { type: string, enum: [percent, g, oz] }
        liquidMethod: { type: string, enum: [batch-22] }
        oils:
          type: array
          items:
            $ref: "#/components/schemas/RecipeOil"
        imported: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    RecipeFragrance:
      type: object
      required: [id, name, amount, unit]
      properties:
        id: { type: string, minLength: 1, maxLength: 120 }
        name: { type: string, minLength: 1, maxLength: 120 }
        amount: { type: number, exclusiveMinimum: 0 }
        unit: { type: string, enum: [g, oz, percent] }
        ifraMaxPercent:
          type: number
          minimum: 0
          maximum: 100
          description: Supplier IFRA maximum for this exact fragrance and bar-soap application, as a percentage of finished product.
        ifraSourceUrl: { type: string, format: uri, maxLength: 500 }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Ingredient:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        alternateNames:
          type: array
          items:
            type: string
        category:
          type: string
          enum: [oil, butter]
        description:
          type: string
        naohSap:
          type: number
        kohSap:
          type: number
        sapSourceTitle:
          type: string
        sapSourceUrl:
          type: string
        sapProvenance:
          type: string
        verificationStatus:
          type: string
          enum: [draft, source-linked-needs-review, administrator-verified]
      required:
        - id
        - name
        - alternateNames
        - category
        - description
        - naohSap
        - kohSap
        - sapSourceTitle
        - sapSourceUrl
        - sapProvenance
        - verificationStatus
    AdminIngredient:
      allOf:
        - $ref: "#/components/schemas/Ingredient"
        - type: object
          required: [active, reviewedBy, reviewedAt, lastEditedBy, revision]
          properties:
            active: { type: boolean }
            reviewedBy: { type: ["string", "null"] }
            reviewedAt: { type: ["string", "null"], format: date-time }
            lastEditedBy: { type: ["string", "null"] }
            revision: { type: integer, minimum: 0 }
    IngredientApproval:
      type: object
      required: [expectedRevision]
      properties:
        expectedRevision: { type: integer, minimum: 0 }
    IngredientStaff:
      type: object
      required: [role]
      properties:
        role: { type: string, enum: [editor, reviewer] }
    IngredientEdit:
      type: object
      additionalProperties: false
      required: [id, name, alternateNames, category, description, naohSap, kohSap, sapSourceTitle, sapSourceUrl, sapProvenance, active]
      properties:
        id: { type: string, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$", maxLength: 100 }
        name: { type: string, minLength: 1, maxLength: 120 }
        alternateNames:
          type: array
          items: { type: string, minLength: 1, maxLength: 120 }
        category: { type: string, enum: [oil, butter] }
        description: { type: string, minLength: 1, maxLength: 2000 }
        naohSap: { type: number, exclusiveMinimum: 0, maximum: 0.5 }
        kohSap: { type: number, exclusiveMinimum: 0, maximum: 0.7 }
        sapSourceTitle: { type: string, maxLength: 300 }
        sapSourceUrl: { type: string, maxLength: 2000 }
        sapProvenance: { type: string, maxLength: 2000 }
        active: { type: boolean }
    Error:
      type: object
      properties:
        error:
          type: string
      required:
        - error
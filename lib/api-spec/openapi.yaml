openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: SoapSpice public ingredient catalog API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: ingredients
    description: Public ingredient reference data
  - name: recipes
    description: Private maker formulas
paths:
  /recipes:
    get:
      operationId: listRecipes
      tags: [recipes]
      summary: List my saved formulas
      responses:
        "200":
          description: My formulas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Recipe"
        "401":
          description: Sign in required
    post:
      operationId: createRecipe
      tags: [recipes]
      summary: Save a validated formula
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecipeInput"
      responses:
        "201":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recipe"
        "400":
          description: Invalid formula
        "401":
          description: Sign in required
  /recipes/import:
    post:
      operationId: importRecipe
      tags: [recipes]
      summary: Preserve a legacy browser formula as an unvalidated draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LegacyRecipeInput"
      responses:
        "201":
          description: Imported draft (or previously imported copy)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recipe"
        "400":
          description: Invalid legacy record
        "401":
          description: Sign in required
  /recipes/{recipeId}:
    parameters:
      - in: path
        name: recipeId
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getRecipe
      tags: [recipes]
      summary: Open my formula
      responses:
        "200":
          description: Formula
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recipe"
        "404":
          description: Not found
    put:
      operationId: updateRecipe
      tags: [recipes]
      summary: Replace my formula after validation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecipeInput"
      responses:
        "200":
          description: Updated formula
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recipe"
        "400":
          description: Invalid formula
        "404":
          description: Not found
    delete:
      operationId: deleteRecipe
      tags: [recipes]
      summary: Delete my formula
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /ingredients:
    get:
      operationId: getIngredients
      tags: [ingredients]
      summary: List soapmaking ingredients
      parameters:
        - in: query
          name: search
          required: false
          schema:
            type: string
            maxLength: 100
        - in: query
          name: category
          required: false
          schema:
            type: string
            enum: [oil, butter]
      responses:
        "200":
          description: Source-linked ingredient reference data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Ingredient"
  /ingredients/{ingredientId}:
    get:
      operationId: getIngredient
      tags: [ingredients]
      summary: Get a soapmaking ingredient
      parameters:
        - in: path
          name: ingredientId
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 100
      responses:
        "200":
          description: Ingredient reference data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ingredient"
        "404":
          description: Ingredient not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    RecipeOilInput:
      type: object
      required: [id, percentage, weight]
      properties:
        id: { type: string, minLength: 1, maxLength: 100 }
        name: { type: string, maxLength: 120 }
        percentage: { type: number, minimum: 0, maximum: 100 }
        weight: { type: number, minimum: 0 }
    RecipeInput:
      type: object
      required: [name, batchSize, unit, superfat, oils]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        batchSize: { type: number, exclusiveMinimum: 0 }
        unit: { type: string, enum: [g, oz, lb] }
        superfat: { type: number, minimum: 0, maximum: 15 }
        concentration: { type: number, minimum: 25, maximum: 50 }
        fragrances:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/RecipeFragrance"
        liquidType: { type: string, enum: [distilled-water, goat-milk, cow-milk, other] }
        customLiquid: { type: string, maxLength: 120 }
        oilInputUnit: { type: string, enum: [percent, g, oz] }
        liquidMethod: { type: string, enum: [batch-22] }
        oils:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: "#/components/schemas/RecipeOilInput"
    LegacyRecipeInput:
      type: object
      required: [legacyId, name, batchSize, unit, superfat, oils]
      properties:
        legacyId: { type: string, minLength: 1, maxLength: 120 }
        name: { type: string, minLength: 1, maxLength: 120 }
        batchSize: { type: number, exclusiveMinimum: 0 }
        unit: { type: string, enum: [g, oz, lb] }
        superfat: { type: number, minimum: 0, maximum: 15 }
        concentration: { type: number, minimum: 25, maximum: 50 }
        fragrances:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/RecipeFragrance"
        liquidType: { type: string, enum: [distilled-water, goat-milk, cow-milk, other] }
        customLiquid: { type: string, maxLength: 120 }
        oilInputUnit: { type: string, enum: [percent, g, oz] }
        liquidMethod: { type: string, enum: [batch-22] }
        oils:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: "#/components/schemas/RecipeOilInput"
    RecipeOil:
      type: object
      required: [id, name, percentage, weight, savedSap]
      properties:
        id: { type: string }
        name: { type: string }
        percentage: { type: number }
        weight: { type: number }
        savedSap: { type: ["number", "null"] }
    Recipe:
      type: object
      required: [id, name, batchSize, unit, superfat, oils, imported, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        batchSize: { type: number }
        unit: { type: string, enum: [g, oz, lb] }
        superfat: { type: number }
        concentration: { type: number }
        fragrances:
          type: array
          items:
            $ref: "#/components/schemas/RecipeFragrance"
        liquidType: { type: string, enum: [distilled-water, goat-milk, cow-milk, other] }
        customLiquid: { type: string }
        oilInputUnit: { type: string, enum: [percent, g, oz] }
        liquidMethod: { type: string, enum: [batch-22] }
        oils:
          type: array
          items:
            $ref: "#/components/schemas/RecipeOil"
        imported: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    RecipeFragrance:
      type: object
      required: [id, name, amount, unit]
      properties:
        id: { type: string, minLength: 1, maxLength: 120 }
        name: { type: string, minLength: 1, maxLength: 120 }
        amount: { type: number, exclusiveMinimum: 0 }
        unit: { type: string, enum: [g, oz, percent] }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Ingredient:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        alternateNames:
          type: array
          items:
            type: string
        category:
          type: string
          enum: [oil, butter]
        description:
          type: string
        naohSap:
          type: number
        kohSap:
          type: number
        sapSourceTitle:
          type: string
        sapSourceUrl:
          type: string
        verificationStatus:
          type: string
          enum: [source-linked-needs-review, administrator-verified]
      required:
        - id
        - name
        - alternateNames
        - category
        - description
        - naohSap
        - kohSap
        - sapSourceTitle
        - sapSourceUrl
        - verificationStatus
    Error:
      type: object
      properties:
        error:
          type: string
      required:
        - error